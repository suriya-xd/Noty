name: "Build Desktop (Windows, macOS, Linux)"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""
            artifact_name: "GitVault-Windows-x64"
            artifact_path: "src-tauri/target/release/bundle/nsis/*.exe\nsrc-tauri/target/release/bundle/msi/*.msi"
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target universal-apple-darwin"
            artifact_name: "GitVault-macOS-Universal"
            artifact_path: "src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: ""
            artifact_name: "GitVault-Linux-x64"
            artifact_path: "src-tauri/target/release/bundle/appimage/*.AppImage\nsrc-tauri/target/release/bundle/deb/*.deb"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend bundle
        run: npm run build

      - name: Build Desktop application with Tauri
        run: npx tauri build ${{ matrix.args }}

      - name: Upload Desktop Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/deb/*.deb
          if-no-files-found: warn
