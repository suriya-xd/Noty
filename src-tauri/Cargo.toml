[package]
name = "noetic"
version = "0.1.0"
description = "Noetic - Native Git-backed Markdown Note-taking App"
authors = ["Noetic Team"]
edition = "2021"

[lib]
name = "noetic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
similar = "2.6"
chrono = "0.4"
walkdir = "2.5"
# HTTPS for the GitHub sign-in calls (src/github_auth.rs). The "tls" feature is rustls with bundled
# root certificates, so it works the same on every platform, including Android, which has no
# system OpenSSL certificate store to rely on. The earlier "native-tls" feature on its own enables
# no HTTPS at all: ureq only uses it when the code also passes it a connector, which was never
# done, so every request failed with "no TLS backend is configured".
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }

# Windows and Linux: libgit2's HTTPS uses Schannel (Windows) or the system OpenSSL (Linux).
[target.'cfg(not(any(target_os = "android", target_os = "macos")))'.dependencies]
git2 = "0.19"

# macOS: libgit2's HTTPS uses SecureTransport, but its SSH support (libssh2) still needs OpenSSL.
# Build OpenSSL into the app: linking it dynamically tied the release binary to the build
# machine's Homebrew copy (/opt/homebrew/opt/openssl@4), so it crashed at launch on other Macs
# ("Library not loaded: libssl.4.dylib"), and even on Macs with Homebrew, since macOS refuses to
# load a library signed by a different team into the app.
[target.'cfg(target_os = "macos")'.dependencies]
git2 = { version = "0.19", features = ["vendored-openssl"] }

# Android: use vendored OpenSSL compiled via Android NDK clang
[target.'cfg(target_os = "android")'.dependencies]
git2 = { version = "0.19", features = ["vendored-openssl"] }
# The same libgit2 and OpenSSL that git2 builds (Cargo shares them), used directly to give git's
# OpenSSL the system's trusted certificates (trust_android_system_certificates in src/lib.rs).
libgit2-sys = "0.17"
openssl-sys = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
